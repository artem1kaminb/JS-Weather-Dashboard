<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js-weather-dashboard</title>
  </head>
<body>
    <div class="container">
        <h1>JS Weather Dashboard</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Введіть місто...">
            <button id="search-btn">Пошук</button>
        </div>

        <div id="weather-info" class="weather-card hidden"></div>

        <div class="history">
            <h3>Останні пошуки</h3>
            <ul id="history-list"></ul>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
